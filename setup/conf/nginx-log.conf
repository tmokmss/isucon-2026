# isuh setup logs が /etc/nginx/conf.d/isuh-log.conf に置く（http ブロックの中で読まれる）。
# alp ltsv が読む形式。ラベル名は alp の既定（uri / method / status / reqtime ...）に合わせる。
# 名前を ltsv にしないのは、既存の nginx.conf が同名を定義していると nginx -t が落ちるため。
log_format isuh_ltsv "time:$time_local"
                     "\thost:$remote_addr"
                     "\tforwardedfor:$http_x_forwarded_for"
                     "\treq:$request"
                     "\tstatus:$status"
                     "\tmethod:$request_method"
                     "\turi:$request_uri"
                     "\tsize:$body_bytes_sent"
                     "\treferer:$http_referer"
                     "\tua:$http_user_agent"
                     "\treqtime:$request_time"
                     "\tapptime:$upstream_response_time"
                     "\tcache:$upstream_http_x_cache"
                     "\tvhost:$host";
access_log {{ACCESS_LOG}} isuh_ltsv;
