# チューニングの定番。**参考用で、自動では入れない。**
# 計測して nginx がボトルネックだと分かってから、conf/<host>/etc/nginx/ の該当箇所に写す（CLAUDE.md「計測せずに推測で最適化しない」）。

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 10000;

    # 静的ファイルの配信は nginx に任せる（アプリに届かせない）
    open_file_cache max=10000 inactive=60s;

    # 応答の圧縮。JSON が大きい問題で効く。gzip_static は事前圧縮したファイルがあれば使う
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1024;

    # アプリとの接続を使い回す（upstream に keepalive、proxy は HTTP/1.1 で Connection を空に）
    upstream app {
        server 127.0.0.1:8080;
        keepalive 64;
        keepalive_requests 10000;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }

        # 静的ファイル。パスは当日の public ディレクトリに合わせる。キャッシュヘッダを付ける
        # （レスポンスの中身は変えないこと。レギュレーション）
        location ~ ^/(assets|images|favicon\.ico) {
            root /home/isucon/webapp/public;
            expires 1d;
        }
    }
}
