name: isuh-test

# サブネットを明示する。Docker の既定プール（172.17-172.31 / 192.168.x）は
# 他プロジェクトのネットワークで埋まっていることがあり、自動割り当てだと
# "all predefined address pools have been fully subnetted" で起動できないため。
networks:
  default:
    ipam:
      config:
        - subnet: 10.99.0.0/24

# 競技環境に寄せて 3 台。互いに isu1 / isu2 / isu3 で名前解決できる。
# アドレスを固定するのは、setup が /etc/hosts に書く private アドレスを config.test.ts に書くため。
services:
  isu1:
    build: .
    hostname: isu1
    ports: ["22101:22"]
    networks: { default: { ipv4_address: 10.99.0.11 } }
    volumes: ["./.work/authorized_keys:/authorized_keys:ro"]
  isu2:
    build: .
    hostname: isu2
    ports: ["22102:22"]
    networks: { default: { ipv4_address: 10.99.0.12 } }
    volumes: ["./.work/authorized_keys:/authorized_keys:ro"]
  isu3:
    build: .
    hostname: isu3
    ports: ["22103:22"]
    networks: { default: { ipv4_address: 10.99.0.13 } }
    volumes: ["./.work/authorized_keys:/authorized_keys:ro"]
