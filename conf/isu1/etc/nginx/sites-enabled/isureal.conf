upstream isureal_app {
  server 127.0.0.1:8080;
  keepalive 256;
}

server {
  listen 80 default_server;
  server_name _;

  client_max_body_size 32m;
  # 投稿の画像・画像の取得・エクスポートの応答を一時ファイルに書かず、メモリだけで中継する
  client_body_buffer_size 2m;
  proxy_buffer_size 32k;
  proxy_buffers 64 32k;
  proxy_busy_buffers_size 256k;
  proxy_max_temp_file_size 0;
  root /home/isucon/webapp/public;

  # 状態を持つアプリは asia1 の 1 台だけ。受けた台のリージョンを X-Isureal-Region で渡す（クライアントの値は上書きする）
  location = /api/notifications {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Isureal-Jpeg "";
    proxy_set_header X-Isureal-Region asia;
    proxy_buffering off;
    proxy_pass http://isureal_app;
  }

  location /api/ {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Isureal-Jpeg "";
    proxy_set_header X-Isureal-Region asia;
    proxy_pass http://isureal_app;
  }

  location / {
    try_files $uri /index.html;
  }
}
