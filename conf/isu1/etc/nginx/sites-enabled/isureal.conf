upstream isureal_app {
  server 127.0.0.1:8080;
  keepalive 256;
}

# asia2 の複製（replica_server.go）。GET の読み取りを返し、追いついていなければ asia1 へ転送する。asia2 のアプリが落ちている間は asia1 へ送る
upstream isureal_replica {
  server 192.168.4.10:8080;
  server 127.0.0.1:8080 backup;
  keepalive 256;
}

# memories は画像の署名が重く、SHA-NI の無い asia2 では遅いので、europe1・america1 の複製に返させる。X-Isureal-Region asia を付けるので asia の利用者として答える
upstream isureal_replica_sign {
  server 192.168.2.10:8080;
  server 192.168.3.10:8080;
  server 127.0.0.1:8080 backup;
  server 192.168.4.10:8080 backup;
  keepalive 256;
}

# export も署名が重いが、応答が約 1.9MB あり EU/US から返すとリージョン間の帯域を使うので、asia1 の手元で返す
upstream isureal_export {
  server 127.0.0.1:8080;
  server 192.168.4.10:8080 backup;
  keepalive 256;
}

map "$request_method $uri" $isureal_api {
  "GET /api/me/export" isureal_export;
  "~^GET /api/memories(/|$)" isureal_replica_sign;
  "~^GET " isureal_replica;
  default isureal_app;
}

server {
  listen 80 default_server;
  server_name _;

  client_max_body_size 32m;
  # 投稿の画像・画像の取得・エクスポートの応答を一時ファイルに書かず、メモリだけで中継する
  client_body_buffer_size 2m;
  proxy_buffer_size 32k;
  proxy_buffers 64 32k;
  proxy_busy_buffers_size 256k;
  proxy_max_temp_file_size 0;
  root /home/isucon/webapp/public;

  # 状態を持つアプリは asia1 の 1 台だけ。受けた台のリージョンを X-Isureal-Region で渡す（クライアントの値は上書きする）
  location = /api/notifications {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Isureal-Jpeg "";
    proxy_set_header X-Isureal-Image "";
    proxy_set_header X-Isureal-Region asia;
    proxy_buffering off;
    proxy_pass http://isureal_app;
  }

  location /api/images/ {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Isureal-Jpeg "";
    proxy_set_header X-Isureal-Image "";
    proxy_set_header X-Isureal-Region asia;
    proxy_pass http://isureal_app;
  }

  location /api/ {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Isureal-Jpeg "";
    proxy_set_header X-Isureal-Image "";
    proxy_set_header X-Isureal-Region asia;
    proxy_connect_timeout 1s;
    proxy_pass http://$isureal_api;
  }

  location / {
    try_files $uri /index.html;
  }
}
