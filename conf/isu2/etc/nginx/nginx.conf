user www-data;
worker_processes auto;
pid /run/nginx.pid;
# SSE の接続を張りっぱなしにするので、ワーカーが開けるファイル数を増やす（既定 1024）
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;

# 443 は L4（TLS のまま）で受けて、isu2 自身の nginx（127.0.0.1:8443）と isu4 の nginx に振り分ける。
# isu2 の nginx だけで TLS・HTTP/2 を終端すると 2 コアとも張り付いていた（座標の送信が平均 38ms。1 tick = 30ms を超えると椅子が止まる）
stream {
  upstream tls_frontends {
    # isu2 は振り分け（L4 の転送）も受け持つので、isu4 に多めに振る（1:1 だと isu2 が張り付き、isu4 は約 40% 空いていた）
    server 127.0.0.1:8443 weight=1;
    server isu4:443 weight=1;
  }
  server {
    listen 443;
    proxy_pass tls_frontends;
    proxy_connect_timeout 2s;
    proxy_timeout 10m; # SSE を張りっぱなしにする
  }
}

events {
	# SSE 1 本でクライアント側とアプリ側の 2 接続を使う。768 だと約 750 本で頭打ちになった
	worker_connections 16384;
	# multi_accept on;
}

http {

	##
	# Basic Settings
	##

	sendfile on;
	tcp_nopush on;
	types_hash_max_size 2048;
	# server_tokens off;

	# server_names_hash_bucket_size 64;
	# server_name_in_redirect off;

	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	##
	# SSL Settings
	##

	ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3; # Dropping SSLv3, ref: POODLE
	ssl_prefer_server_ciphers on;

	##
	# Logging Settings
	##

	# isuh: access_log /var/log/nginx/access.log;

	##
	# Gzip Settings
	##

	gzip on;

	# gzip_vary on;
	# gzip_proxied any;
	# gzip_comp_level 6;
	# gzip_buffers 16 8k;
	# gzip_http_version 1.1;
	# gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

	##
	# Virtual Host Configs
	##

	include /etc/nginx/conf.d/*.conf;
	include /etc/nginx/sites-enabled/*;
}


