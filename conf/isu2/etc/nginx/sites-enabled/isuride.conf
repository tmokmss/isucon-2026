# アプリとの接続を使い回す（upstream に keepalive、proxy は HTTP/1.1 で Connection を空に）
upstream app {
  server isu1:8080; # アプリは isu1。nginx（TLS の終端・静的ファイル）は isu2 が受け持つ
  # 待機させておく接続の上限（ワーカーごと）。64 だと足りず、ベンチ中に isu1 への接続を毎秒約 3800 本張り直していた（nstat の TcpActiveOpens）
  keepalive 4096;
  keepalive_timeout 120s;
  keepalive_requests 10000;
}

server {
  listen 80 default_server;
  server_name _;
  index index.html index.htm index.nginx-debian.html;
  root /var/www/html;
  location / {
    try_files $uri $uri/ =404;
  }
}

server {
  listen 443 ssl default_server;
  server_name _;
  index index.html index.htm index.nginx-debian.html;
  root /var/www/html;

  # bot避けのためのvhostで、この証明書は自己署名です
  ssl_certificate     /etc/nginx/tls/dummy.crt;
  ssl_certificate_key /etc/nginx/tls/dummy.key;
  ssl_protocols TLSv1.3;
  ssl_prefer_server_ciphers off;

  location / {
    try_files $uri $uri/ =404;
  }
}

server {
  listen 443 ssl;
  server_name xiv.isucon.net;
  server_name *.xiv.isucon.net;

  ssl_certificate     /etc/nginx/tls/_.xiv.isucon.net.crt;
  ssl_certificate_key /etc/nginx/tls/_.xiv.isucon.net.key;

  ssl_protocols TLSv1.3;
  ssl_prefer_server_ciphers off;

  client_max_body_size 10m;
  root /home/isucon/webapp/public/;
  # 静的ファイル（フロントエンド）。ベンチマーカーは画面を開くたびに条件付きで取り直し、
  # 1 ランで約 121 万件の 304 になっていた。キャッシュさせて取り直しを減らし、ログも書かない
  # （ファイルの中身は変えない。ヘッダを足すだけ）
  location / {
    try_files $uri /index.html;
    expires 1d;
    access_log off;
    open_file_cache max=1000 inactive=60s;
  }
  location /api/ {
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_pass http://app;
  }

  location /api/internal/ {
    # localhostからのみアクセスを許可
    allow 127.0.0.1;
    deny all;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_pass http://app;
  }
}
