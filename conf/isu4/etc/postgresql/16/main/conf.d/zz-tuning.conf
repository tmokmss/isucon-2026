# c5.large（2 vCPU・メモリ3.8GB）に PostgreSQL だけが載っている前提
# shared_preload_libraries は postgresql.auto.conf 側（pg_stat_statements）にあるので書かない
shared_buffers = 1GB
effective_cache_size = 2560MB
random_page_cost = 1.1
work_mem = 16MB
max_wal_size = 4GB
# asia1（100 + 2）と europe1・america1 の画像のアプリ（各 40）が同時に開くと、既定の 100 を超える
max_connections = 300
# 異常終了時に失うのは直近の数百 ms のコミットだけ。正常な停止では失わない
synchronous_commit = off
