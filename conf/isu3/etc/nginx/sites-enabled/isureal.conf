upstream isureal_app {
  server 192.168.1.10:8080;
  keepalive 256;
}

# この台のアプリが落ちている間は asia1 へ送る
upstream isureal_local {
  server 127.0.0.1:8080;
  server 192.168.1.10:8080 backup;
  keepalive 256;
}

server {
  listen 80 default_server backlog=4096;
  server_name _;

  client_max_body_size 32m;
  # 投稿の画像・画像の取得・エクスポートの応答を一時ファイルに書かず、メモリだけで中継する
  client_body_buffer_size 2m;
  proxy_buffer_size 32k;
  proxy_buffers 64 32k;
  proxy_busy_buffers_size 256k;
  proxy_max_temp_file_size 0;
  root /home/isucon/webapp/public;

  # 状態を持つアプリは asia1 の 1 台だけ。受けた台のリージョンを X-Isureal-Region で渡す（クライアントの値は上書きする）
  location = /api/notifications {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Isureal-Jpeg "";
    proxy_set_header X-Isureal-Image "";
    proxy_set_header X-Isureal-Region america;
    proxy_buffering off;
    proxy_pass http://isureal_app;
  }

  # 画像はこの台のアプリが手元のファイルから返す（image_local.go）
  location /api/images/ {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Isureal-Jpeg "";
    proxy_set_header X-Isureal-Image "";
    proxy_pass http://isureal_local;
  }

  # 投稿はこの台のアプリが画像を検証してから asia1 へ送る（post_forward.go）
  location = /api/posts {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Isureal-Jpeg "";
    proxy_set_header X-Isureal-Image "";
    proxy_set_header X-Isureal-Region america;
    proxy_pass http://isureal_local;
  }

  # この台のアプリが、複製が追いついている間は読み取りの一部を手元で返し、残りを asia1 へ転送する（replica_server.go）
  location /api/ {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Isureal-Jpeg "";
    proxy_set_header X-Isureal-Image "";
    proxy_set_header X-Isureal-Region america;
    proxy_pass http://isureal_local;
  }

  location / {
    try_files $uri /index.html;
  }
}
